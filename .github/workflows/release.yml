# Build a signed LinarTV APK.
# - push of a tag vX.Y.Z  -> GitHub Release with LinarTV.apk
# - manual run (Actions -> Run workflow) -> APK only as a workflow artifact
# Required repository secrets:
#   KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
name: Build APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Check tag matches versionName
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          NAME=$(grep -oP "versionName '\K[^']+" app/build.gradle)
          if [ "v$NAME" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} != versionName $NAME in app/build.gradle"; exit 1
          fi

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "Missing KEYSTORE_BASE64 secret"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleRelease
          mkdir -p dist
          cp app/build/outputs/apk/release/LinarTV-*-release.apk dist/LinarTV.apk
          sha256sum dist/LinarTV.apk | tee dist/LinarTV.apk.sha256

      - name: Remove signing material
        if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: LinarTV-apk
          path: dist/

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/LinarTV.apk
            dist/LinarTV.apk.sha256
          generate_release_notes: true
